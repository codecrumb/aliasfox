[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aliasfox"
version = "0.1.0"
description = "AliasFox core service"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "psycopg[binary]",
    "httpx",
    "cryptography",
    "argon2-cffi",
    "pydantic-settings",
    "itsdangerous",
    "pyicloud",
    "alembic",
    "pyjwt[crypto]",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aliasfox = [
    "migrations/*.mako",
    "migrations/*.py",
    "migrations/versions/*.py",
    "page_templates/*.html",
    "page_templates/*.css",
    "page_templates/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
